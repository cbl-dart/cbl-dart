name: cbd
description: CBL Dart project dev tools CLI
publish_to: 'none'
version: 0.0.0

executables:
  cbd:

environment:
  sdk: ^3.5.0

dependencies:
  analyzer: ^7.0.0
  args: ^2.6.0
  cbl: ^3.6.0+2
  cli_launcher: ^0.3.1
  cli_util: ^0.4.2
  collection: ^1.19.1
  dart_style: ^3.1.0
  meta: ^1.16.0
  package_config: ^2.1.0
  path: ^1.9.1
  pub_semver: ^2.1.4
  yaml: ^3.1.2

# The tool must build with the local cbl so that fixes to cbl's install code
# are used before they are published.
dependency_overrides:
  cbl:
    path: ../packages/cbl
