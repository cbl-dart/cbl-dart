ignore:
  # Ignore all test code
  - 'packages/.*/test/.*'
  - 'packages/.*/integration_test/.*'
  - 'packages/cbl_e2e_tests/.*'

codecov:
  notify:
    # Coverage uploads are aggregated in CI and notifications are triggered
    # only after every report has been uploaded.
    manual_trigger: true

flag_management:
  default_rules:
    # Do not carry forward stale flags after upload names change.
    carryforward: false
  individual_flags:
    # Current CI coverage uploads may be carried forward when a matrix leg
    # fails before producing coverage.
    - name: unit.runtime.vm.platform.ubuntu
      carryforward: true
    - name: unit.runtime.vm.platform.macos
      carryforward: true
    - name: unit.runtime.vm.platform.windows
      carryforward: true
    - name: e2e.runtime.vm.platform.ubuntu
      carryforward: true
    - name: e2e.runtime.vm.platform.macos
      carryforward: true
    - name: e2e.runtime.vm.platform.windows
      carryforward: true

component_management:
  individual_components:
    - component_id: cbl
      name: cbl
      paths:
        - packages/cbl/lib/**
    - component_id: cbl_sentry
      name: cbl_sentry
      paths:
        - packages/cbl_sentry/lib/**
    - component_id: cbl_generator
      name: cbl_generator
      paths:
        - packages/cbl_generator/lib/**

coverage:
  status:
    project:
      default:
        threshold: 0.2%
