name: RunsOn v3 smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runs-on-v3-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Native round trip and cache - ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu22-2cpu, ubuntu22-4cpu]
    runs-on: runs-on=${{ github.run_id }}/runner=${{ matrix.runner }}/env=production
    steps:
      - uses: runs-on/action@v2
      - uses: actions/checkout@v6
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Verify workspace and host
        shell: bash
        run: |
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          printf 'Workspace: %s\n' "$GITHUB_WORKSPACE"
          df -h .
      - name: Restore smoke cache
        id: cache
        uses: actions/cache@v5
        with:
          path: .migration-cache
          key: runs-on-v3-smoke-${{ matrix.runner }}-${{ hashFiles('pubspec.lock') }}
      - name: Verify or initialize cache
        shell: bash
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          mkdir -p .migration-cache
          if [[ "$CACHE_HIT" == true ]]; then
            test "$(cat .migration-cache/probe)" = runs-on-v3
          else
            printf 'runs-on-v3\n' > .migration-cache/probe
          fi
          printf 'Cache hit: %s\n' "$CACHE_HIT"
      - name: Build native assets and exercise database
        shell: bash
        run: bash tools/test-hook-compatibility.sh latest
