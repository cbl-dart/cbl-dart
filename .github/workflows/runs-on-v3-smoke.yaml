name: APT-only cache benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bench-apt-${{ github.ref }}
  cancel-in-progress: false

jobs:
  baseline:
    name: APT baseline - ${{ matrix.workload }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        workload: [cross, desktop]
    runs-on: runs-on=${{ github.run_id }}/family=c7i.large/image=ubuntu22-full-x64/env=production/extras=s3-cache/volume=40gb:gp3:400mbps:3000iops
    steps:
      - uses: runs-on/action@v2
      - uses: actions/checkout@v6
      - name: Benchmark apt workload
        env:
          WORKLOAD: ${{ matrix.workload }}
          MODE: baseline
        run: python3 tools/benchmarks/apt.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: apt-baseline-${{ matrix.workload }}
          path: benchmark-results

  cached-first:
    name: APT first cache observation - ${{ matrix.workload }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        workload: [cross, desktop]
    runs-on: runs-on=${{ github.run_id }}/family=c7i.large/image=ubuntu22-full-x64/env=production/extras=s3-cache+apt-cache/volume=40gb:gp3:400mbps:3000iops
    steps:
      - uses: runs-on/action@v2
      - uses: actions/checkout@v6
      - name: Benchmark apt workload
        env:
          WORKLOAD: ${{ matrix.workload }}
          MODE: cached-first
        run: python3 tools/benchmarks/apt.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: apt-cached-first-${{ matrix.workload }}
          path: benchmark-results

  cached-warm:
    name: APT warm cache - ${{ matrix.workload }}
    needs: cached-first
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        workload: [cross, desktop]
    runs-on: runs-on=${{ github.run_id }}/family=c7i.large/image=ubuntu22-full-x64/env=production/extras=s3-cache+apt-cache/volume=40gb:gp3:400mbps:3000iops
    steps:
      - uses: runs-on/action@v2
      - uses: actions/checkout@v6
      - name: Benchmark apt workload
        env:
          WORKLOAD: ${{ matrix.workload }}
          MODE: cached-warm
        run: python3 tools/benchmarks/apt.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: apt-cached-warm-${{ matrix.workload }}
          path: benchmark-results
