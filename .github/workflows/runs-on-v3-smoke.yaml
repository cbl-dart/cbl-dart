name: Gradle cache benchmark

on:
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        options: [cold, warm]
        default: cold
      batch:
        type: string
        default: "20261110-g1"
      modes:
        type: string
        default: '["default","local","remote","both"]'

permissions:
  contents: read

concurrency:
  group: gradle-bench-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  gradle:
    name: Gradle cache - ${{ matrix.mode }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        mode: ${{ fromJSON(inputs.modes) }}
    runs-on: runs-on=${{ github.run_id }}/runner=ubuntu22-2cpu/env=production/extras=s3-cache
    env:
      BENCH_MODE: ${{ matrix.mode }}
      BENCH_PHASE: ${{ inputs.phase }}
      BENCH_BATCH: ${{ inputs.batch }}
    steps:
      - uses: runs-on/action@v2
        with:
          remote_cache: ${{ (matrix.mode == 'remote' || matrix.mode == 'both') && 'gradle' || '' }}
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install bounded Android compile tools
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Setup Gradle and restore file caches
        id: gradle-setup
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.14"
          cache-read-only: false
          cache-write-only: ${{ inputs.phase == 'cold' }}
          gradle-home-cache-excludes: ${{ matrix.mode == 'remote' && 'caches/build-cache-1/**' || '' }}
          gradle-home-cache-strict-match: true
      - name: Compile bounded Android fixture
        run: bash tools/bench-gradle-fixture.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gradle-${{ matrix.mode }}-${{ inputs.phase }}
          path: bench-results
