name: Isolated Docker pull cache benchmark

on:
  workflow_dispatch:
    inputs:
      backend:
        type: choice
        options: [direct, ecr]
        default: direct
        required: true
      sample:
        description: Benchmark sample label
        type: string
        default: direct-1
        required: true
      ecr_prefix:
        description: ECR pull-through prefix (without registry hostname)
        type: string
        default: runson-bench-docker-hub
        required: true

permissions:
  contents: read

concurrency:
  group: ecr-bench-${{ github.ref }}-${{ inputs.backend }}-${{ inputs.sample }}
  cancel-in-progress: false

jobs:
  pull:
    name: ${{ inputs.backend }} / ${{ inputs.sample }} / ${{ matrix.label }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: couchbase-server
            image: couchbase/server:enterprise-7.6.9
          - label: sync-gateway
            image: couchbase/sync-gateway:4.0.3-community
    runs-on: runs-on=${{ github.run_id }}/family=c7a.large/image=ubuntu22-full-x64/volume=40gb:gp3:400mbps:3000iops/extras=s3-cache/env=production
    steps:
      - uses: runs-on/action@v2
      - uses: actions/checkout@v6
      - name: Authenticate ECR
        if: inputs.backend == 'ecr'
        env:
          ECR_REGISTRY: 020676528030.dkr.ecr.eu-central-1.amazonaws.com
        run: aws ecr get-login-password --region eu-central-1 | docker login --username AWS --password-stdin "$ECR_REGISTRY"
      - name: Measure fresh-daemon image pull
        env:
          BENCH_BACKEND: ${{ inputs.backend }}
          BENCH_SAMPLE: ${{ inputs.sample }}
          BENCH_LABEL: ${{ matrix.label }}
          BENCH_IMAGE: ${{ matrix.image }}
          BENCH_ECR_PREFIX: ${{ inputs.ecr_prefix }}
        run: python3 .github/benchmarks/ecr/pull.py
      - name: Upload timings and pull log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ecr-benchmark-${{ inputs.backend }}-${{ inputs.sample }}-${{ matrix.label }}
          path: .benchmark-ecr
          include-hidden-files: true
          retention-days: 3
