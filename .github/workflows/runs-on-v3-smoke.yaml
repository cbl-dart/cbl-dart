name: Sticky versus S3 Flutter Pub benchmark

on:
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        required: true
        options: [cold, warm]
      backend:
        type: choice
        required: true
        default: all
        options: [all, s3, sticky]
      initialization:
        type: choice
        required: true
        default: provisioned
        options: [provisioned, lazy]

permissions:
  contents: read

jobs:
  benchmark:
    name: ${{ matrix.backend }} Flutter Pub - ${{ inputs.phase }} - ${{ inputs.initialization }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        backend: ${{ fromJSON(inputs.backend == 'all' && '["s3","sticky"]' || format('["{0}"]', inputs.backend)) }}
    runs-on: runs-on=${{ github.run_id }}/runner=ubuntu22-2cpu/family=c7a.large/env=production/extras=s3-cache${{ matrix.backend == 'sticky' && format('/sticky=bench-flutter3479-20261110:20gb{0}', inputs.initialization == 'lazy' && ':lazy-init' || '') || '' }}
    env:
      BENCH_BACKEND: ${{ matrix.backend }}
      BENCH_PHASE: ${{ inputs.phase }}
      BENCH_INITIALIZATION: ${{ inputs.initialization }}
      CACHE_ROOT: /home/runner/.cache/bench-flutter-3479-v1
      PUB_CACHE: /home/runner/.cache/bench-flutter-3479-v1/pub
      FLUTTER_SUPPRESS_ANALYTICS: "true"
      DART_SUPPRESS_ANALYTICS: "true"
      CI: "true"
    steps:
      - uses: actions/checkout@v6
      - name: Map sticky SDK and Pub cache
        if: matrix.backend == 'sticky'
        id: sticky
        uses: runs-on/action@v2
        with:
          sticky_cache: custom,path=~/.cache/bench-flutter-3479-v1
          sticky_save: ${{ inputs.phase == 'cold' }}
          sticky_wait_timeout: 3m
      - uses: runs-on/action@v2
        if: matrix.backend == 's3'
      - name: Restore S3 SDK and Pub cache
        if: matrix.backend == 's3'
        id: s3
        uses: actions/cache/restore@v5
        with:
          path: /home/runner/.cache/bench-flutter-3479-v1
          key: bench-sticky-flutter-pub-${{ runner.os }}-${{ runner.arch }}-3479-25ed8c3c-${{ hashFiles('tools/bench-flutter-pub.py', 'pubspec.lock') }}-v1
      - name: Verify cache phase
        env:
          CACHE_HIT: ${{ steps.sticky.outputs.cache-hit || steps.s3.outputs.cache-hit }}
        run: |
          printf 'Backend=%s Phase=%s CacheHit=%s\n' "$BENCH_BACKEND" "$BENCH_PHASE" "$CACHE_HIT"
          if [[ "$BENCH_PHASE" == cold ]]; then
            test "$CACHE_HIT" != true
          else
            test "$CACHE_HIT" = true
          fi
          if [[ "$BENCH_BACKEND" == sticky ]]; then
            test -f "$RUNS_ON_STICKYDISK_READY_FILE"
            mountpoint "$RUNS_ON_STICKYDISK_DIR"
          fi
      - name: Install SDK and exercise Pub cache
        env:
          CACHE_HIT: ${{ steps.sticky.outputs.cache-hit || steps.s3.outputs.cache-hit }}
        run: python3 tools/bench-flutter-pub.py
      - name: Save S3 SDK and Pub cache
        if: matrix.backend == 's3' && inputs.phase == 'cold'
        uses: actions/cache/save@v5
        with:
          path: /home/runner/.cache/bench-flutter-3479-v1
          key: bench-sticky-flutter-pub-${{ runner.os }}-${{ runner.arch }}-3479-25ed8c3c-${{ hashFiles('tools/bench-flutter-pub.py', 'pubspec.lock') }}-v1
      - name: Upload measurements
        uses: actions/upload-artifact@v7
        with:
          name: sticky-flutter-${{ matrix.backend }}-${{ inputs.phase }}-${{ inputs.initialization }}
          path: ${{ runner.temp }}/sticky-benchmark-result.json
