name: Docs

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - docs/**
  # Redeploys the docs after release tags are pushed, so that install
  # instructions show the new versions.
  workflow_dispatch:

jobs:
  docs:
    runs-on: runs-on=${{ github.run_id }}/runner=ubuntu22-2cpu/env=production
    steps:
      - uses: runs-on/action@v2
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-tags: true
      - name: Cache npm downloads
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/docs-npm-download-cache
          key: docs-npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('docs/package-lock.json') }}
      - name: Install and build website
        working-directory: docs
        env:
          npm_config_cache: ${{ runner.temp }}/docs-npm-download-cache
        run: |
          npm ci
          npm run check
          npm run build
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          folder: docs/build
