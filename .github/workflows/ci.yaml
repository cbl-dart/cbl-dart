name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - docs/**
  pull_request:
  schedule:
    - cron: "0 0 * * *"

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

env:
  flutter-channel: stable

jobs:
  formatting-dart:
    name: Formatting - Dart
    timeout-minutes: 10
    runs-on: runs-on=${{ github.run_id }}/runner=ubuntu22-2cpu
    steps:
      - uses: runs-on/action@v2
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter
        with:
          channel: ${{ env.flutter-channel }}
          cache: true
          pub-cache-hash-pattern: pubspec.lock

      - name: Setup Melos
        run: dart pub global activate melos

      - name: Install daco
        run: dart pub global activate daco

      - name: Get dependencies
        run: dart pub get

      - name: Check formatting
        run: melos formatting:check

      - name: Print diff
        if: failure()
        run: git diff

  formatting-clang:
    name: Formatting - Clang
    timeout-minutes: 10
    runs-on: runs-on=${{ github.run_id }}/runner=ubuntu22-2cpu
    steps:
      - uses: runs-on/action@v2
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check formatting
        uses: jidicula/clang-format-action@v4.17.0
        with:
          clang-format-version: "21"
          check-path: "packages/cbl/native/couchbase-lite-dart"

  analyze-dart:
    name: Analyze Dart code
    timeout-minutes: 10
    runs-on: runs-on=${{ github.run_id }}/runner=ubuntu22-2cpu
    steps:
      - uses: runs-on/action@v2
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter
        with:
          channel: ${{ env.flutter-channel }}
          cache: true
          pub-cache-hash-pattern: pubspec.lock

      - name: Setup Melos
        run: dart pub global activate melos

      - name: Bootstrap repository
        shell: bash
        run: melos bootstrap

      - name: Analyze Dart code
        run: melos analyze

  publish-dry-run:
    name: Publish dry run
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        package: [cbl, cbl_sentry, cbl_generator]
    runs-on: runs-on=${{ github.run_id }}/runner=ubuntu22-2cpu
    steps:
      - uses: runs-on/action@v2
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter
        with:
          channel: ${{ env.flutter-channel }}
          cache: true
          pub-cache-hash-pattern: pubspec.lock

      - name: Get dependencies
        run: dart pub get

      - name: Bootstrap repository
        run: dart run melos bootstrap

      - name: Publish dry run
        working-directory: packages/${{ matrix.package }}
        run: dart pub publish --dry-run

  test-dart-unit:
    name: Dart unit tests
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package: [cbl, cbl_sentry, cbl_generator]
        embedder: [standalone]
        os: [Ubuntu]
        include:
          - package: cbl
            embedder: standalone
            os: macOS
          - package: cbl
            embedder: standalone
            os: Windows
    env:
      EMBEDDER: ${{ matrix.embedder }}
      TARGET_OS: ${{ matrix.os }}
      TEST_PACKAGE: ${{ matrix.package }}
    runs-on: >-
      ${{ fromJSON(format('{{
        "Ubuntu":"runs-on={0}/runner=ubuntu22-2cpu",
        "macOS":"macos-15",
        "Windows":"windows-2025"
      }}', github.run_id))[matrix.os] }}
    steps:
      - uses: runs-on/action@v2
        if: runner.os == 'Linux'
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Linux cross-compilation toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Setup Java
        if: runner.os == 'Linux' && matrix.package == 'cbl'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        if: runner.os == 'Linux' && matrix.package == 'cbl'
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        if: runner.os == 'Linux' && matrix.package == 'cbl'
        run: ./tools/android-sdk.sh installNativeToolchain

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter
        with:
          channel: ${{ env.flutter-channel }}
          cache: true
          pub-cache-hash-pattern: pubspec.lock

      - name: Get dependencies
        run: dart pub get

      - name: Bootstrap repository
        shell: bash
        run: dart run melos bootstrap

      - name: Run build_runner
        if: ${{ matrix.package == 'cbl_generator' }}
        shell: bash
        run: ./tools/ci-steps.sh checkBuildRunnerOutput

      - name: Run tests
        id: run-tests
        shell: bash
        run: ./tools/ci-steps.sh runUnitTests

      - name: Collect coverage data
        if: ${{ always() && steps.run-tests.outcome != 'skipped' }}
        shell: bash
        env:
          ALLOW_MISSING_COVERAGE: ${{ steps.run-tests.outcome == 'success' && 'false' || 'true' }}
        run: |
          ./tools/ci-steps.sh collectCoverageData "unit.${{ matrix.package }}.${{ matrix.os }}" "unit.${{ matrix.package }}"

      - name: Upload coverage artifact
        if: ${{ always() && hashFiles('coverage-artifacts/**') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-unit-${{ matrix.package }}-${{ matrix.os }}
          path: coverage-artifacts

  test-e2e:
    name: E2E tests
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        embedder: [standalone, flutter]
        os:
          - iOS
          - macOS
          - Android
          - Ubuntu
          - Windows
        test_platform: [""]
        include:
          # `vm-asan` currently requires the raw Dart SDK from the `main`
          # channel, so we run it as an extra standalone Ubuntu matrix leg.
          - embedder: standalone
            os: Ubuntu
            test_platform: vm-asan
        exclude:
          - embedder: standalone
            os: iOS
          - embedder: standalone
            os: Android
          # TODO: Re-enable once migrated from Warp to GitHub Actions runners.
          - embedder: flutter
            os: iOS
    runs-on: >-
      ${{ matrix.os == 'macOS' && matrix.embedder == 'standalone' && 'macos-15'
       || fromJSON(format('{{
        "iOS":"warp-macos-15-arm64-6x",
        "macOS":"macos-15",
        "Android":"blacksmith-4vcpu-ubuntu-2204",
        "Ubuntu":"runs-on={0}/runner=ubuntu22-4cpu",
        "Windows":"windows-2025"
      }}', github.run_id))[matrix.os] }}
    env:
      EMBEDDER: ${{ matrix.embedder }}
      TARGET_OS: ${{ matrix.os }}
      DART_TEST_PLATFORM: ${{ matrix.test_platform }}
      TEST_PACKAGE: >-
        ${{ fromJSON('{
          "standalone":"cbl_e2e_tests_standalone_dart",
          "flutter":"cbl_e2e_tests_flutter"
        }')[matrix.embedder] }}
    steps:
      - uses: runs-on/action@v2
        if: runner.os == 'Linux'
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Select Java 17
        if: ${{ matrix.os == 'Android' }}
        run: echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"

      - name: Install Android Native Toolchain
        if: ${{ matrix.os == 'Android' }}
        run: ./tools/android-sdk.sh installNativeToolchain

      - name: Install Android App Build Dependencies
        if: ${{ matrix.os == 'Android' }}
        run: ./tools/android-sdk.sh installAppBuildDeps

      - name: Setup Gradle
        if: ${{ matrix.os == 'Android' }}
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false

      - name: Cache apt packages
        if: matrix.os == 'Ubuntu' && matrix.embedder == 'flutter'
        uses: actions/cache@v5
        with:
          path: /var/cache/apt/archives
          key: apt-flutter-linux-desktop-${{ runner.os }}

      - name: Install Flutter Linux Desktop dependencies
        if: matrix.os == 'Ubuntu' && matrix.embedder == 'flutter'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang cmake ninja-build pkg-config libgtk-3-dev lld llvm

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter
        with:
          channel: ${{ env.flutter-channel }}
          cache: true
          pub-cache-hash-pattern: pubspec.lock
          cache-provider: ${{ (matrix.os == 'iOS' && matrix.embedder == 'flutter') && 'warp' || 'github' }}

      - name: Setup Dart SDK
        if: matrix.test_platform == 'vm-asan'
        uses: dart-lang/setup-dart@v1
        with:
          sdk: main
          flavor: raw

      - name: Enable Flutter native assets
        if: matrix.embedder == 'flutter'
        run: flutter config --enable-native-assets

      - name: Get dependencies
        run: dart pub get

      - name: Bootstrap repository
        shell: bash
        run: dart run melos bootstrap

      - name: Cache Android emulator
        if: matrix.os == 'Android'
        uses: actions/cache@v5
        with:
          path: |
            /usr/local/lib/android/sdk/system-images/android-27
          key: android-system-image-27-x86_64-v2

      - name: Start Couchbase services
        shell: bash
        run: ./tools/ci-steps.sh startCouchbaseServices

      - name: Start virtual devices
        if: matrix.embedder == 'flutter'
        shell: bash
        run: ./tools/ci-steps.sh startVirtualDevices

      - name: Run tests
        id: run-tests
        timeout-minutes: 20
        shell: bash
        run: ./tools/ci-steps.sh runE2ETests

      - name: Collect test results
        if: failure()
        timeout-minutes: 8
        shell: bash
        run: ./tools/ci-steps.sh collectTestResults

      - name: Upload test results
        if: ${{ failure() && hashFiles('test-results/**') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.embedder }}${{ matrix.test_platform && format('-{0}', matrix.test_platform) || '' }}
          path: test-results

      - name: Collect coverage data
        # Disabled until we figure out how to get coverage data from flutter tests
        if: ${{ always() && steps.run-tests.outcome != 'skipped' && matrix.embedder != 'flutter' && matrix.test_platform == '' }}
        shell: bash
        env:
          ALLOW_MISSING_COVERAGE: ${{ steps.run-tests.outcome == 'success' && 'false' || 'true' }}
        run: |
          ./tools/ci-steps.sh collectCoverageData "e2e.cbl.${{ matrix.embedder }}.${{ matrix.os }}" "e2e.cbl.${{ matrix.embedder }}.${{ matrix.os }}"

      - name: Upload coverage artifact
        # Disabled until we figure out how to get coverage data from flutter tests
        if: ${{ always() && hashFiles('coverage-artifacts/**') != '' && matrix.embedder != 'flutter' && matrix.test_platform == '' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-e2e-cbl-${{ matrix.embedder }}-${{ matrix.os }}
          path: coverage-artifacts

  upload-coverage:
    name: Upload coverage
    timeout-minutes: 10
    needs:
      - formatting-dart
      - formatting-clang
      - analyze-dart
      - publish-dry-run
      - test-dart-unit
      - test-e2e
    if: >-
      ${{
        always() &&
        !cancelled() &&
        (
          github.event_name == 'pull_request' ||
          (needs.test-dart-unit.result == 'success' && needs.test-e2e.result == 'success')
        )
      }}
    runs-on: runs-on=${{ github.run_id }}/runner=ubuntu22-2cpu
    env:
      CODECOV_BRANCH: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && github.event.pull_request.head.label || github.head_ref || github.ref_name }}
    steps:
      - uses: runs-on/action@v2
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download coverage artifacts
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          pattern: coverage-*
          path: coverage-artifacts
          merge-multiple: true

      - name: Detect downloaded coverage
        id: coverage
        shell: bash
        run: |
          if [ -d coverage-artifacts ] && find coverage-artifacts -type f -name '*.lcov.info' | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare Codecov reports
        if: ${{ steps.coverage.outputs.found == 'true' }}
        shell: bash
        run: |
          for flagDir in coverage-artifacts/*; do
            [ -d "$flagDir" ] || continue

            reportsFile="$(mktemp)"
            find "$flagDir" -maxdepth 1 -type f -name '*.lcov.info' | sort > "$reportsFile"
            [ -s "$reportsFile" ] || {
              rm -f "$reportsFile"
              continue
            }

            reportCount="$(wc -l < "$reportsFile" | tr -d ' ')"
            printf 'Preparing %s from %s report(s)\n' "$flagDir/lcov.info" "$reportCount"
            while IFS= read -r report; do
              cat "$report"
            done < "$reportsFile" > "$flagDir/lcov.info"
            rm -f "$reportsFile"
          done

      - name: Upload cbl unit coverage
        if: ${{ hashFiles('coverage-artifacts/unit.cbl/**') != '' }}
        uses: codecov/codecov-action@v5
        with:
          directory: coverage-artifacts/unit.cbl
          flags: unit.cbl
          name: unit.cbl
          override_branch: ${{ env.CODECOV_BRANCH }}
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true

      - name: Upload cbl_sentry unit coverage
        if: ${{ hashFiles('coverage-artifacts/unit.cbl_sentry/**') != '' }}
        uses: codecov/codecov-action@v5
        with:
          directory: coverage-artifacts/unit.cbl_sentry
          flags: unit.cbl_sentry
          name: unit.cbl_sentry
          override_branch: ${{ env.CODECOV_BRANCH }}
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true

      - name: Upload cbl_generator unit coverage
        if: ${{ hashFiles('coverage-artifacts/unit.cbl_generator/**') != '' }}
        uses: codecov/codecov-action@v5
        with:
          directory: coverage-artifacts/unit.cbl_generator
          flags: unit.cbl_generator
          name: unit.cbl_generator
          override_branch: ${{ env.CODECOV_BRANCH }}
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true

      - name: Upload macOS standalone E2E coverage
        if: ${{ hashFiles('coverage-artifacts/e2e.cbl.standalone.macOS/**') != '' }}
        uses: codecov/codecov-action@v5
        with:
          directory: coverage-artifacts/e2e.cbl.standalone.macOS
          flags: e2e.cbl.standalone.macOS
          name: e2e.cbl.standalone.macOS
          override_branch: ${{ env.CODECOV_BRANCH }}
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true

      - name: Upload Ubuntu standalone E2E coverage
        if: ${{ hashFiles('coverage-artifacts/e2e.cbl.standalone.Ubuntu/**') != '' }}
        uses: codecov/codecov-action@v5
        with:
          directory: coverage-artifacts/e2e.cbl.standalone.Ubuntu
          flags: e2e.cbl.standalone.Ubuntu
          name: e2e.cbl.standalone.Ubuntu
          override_branch: ${{ env.CODECOV_BRANCH }}
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true

      - name: Upload Windows standalone E2E coverage
        if: ${{ hashFiles('coverage-artifacts/e2e.cbl.standalone.Windows/**') != '' }}
        uses: codecov/codecov-action@v5
        with:
          directory: coverage-artifacts/e2e.cbl.standalone.Windows
          flags: e2e.cbl.standalone.Windows
          name: e2e.cbl.standalone.Windows
          override_branch: ${{ env.CODECOV_BRANCH }}
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true

      - name: Send Codecov notifications
        if: ${{ steps.coverage.outputs.found == 'true' }}
        uses: codecov/codecov-action@v5
        with:
          run_command: send-notifications
          override_branch: ${{ env.CODECOV_BRANCH }}
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
